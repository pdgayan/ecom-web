name: Deploy Frontend to S3 

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: setup node
        uses: actions/setup-node@v4
        with:
            node-version: 20

      - name: install depnedencies
        run: npm install
        
      - name: build the app
        run: npm run build

    #   - name: Debug OIDC Token Claims
    #     uses: actions/github-script@v7
    #     with:
    #       script: |
    #         const idToken = await core.getIDToken('sts.amazonaws.com');
    #         const payload = JSON.parse(
    #           Buffer.from(idToken.split('.')[1], 'base64').toString()
    #         );
    #         console.log(payload);


      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463623100443:role/github-actions-ecr-role
          aws-region: us-east-1
     

      - name: push artifact to the s3
        run : aws s3 sync build/ s3://ecom-frontend-test-bucket --delete